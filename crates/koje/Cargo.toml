[package]
name = "koje"
description = "Command line client for koje: isolated work contexts on Hyprland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "koje"
path = "src/main.rs"

[dependencies]
koje-core.workspace = true
koje-podman.workspace = true
koje-hyprland.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
futures-util.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true

# The koje package (ADR 0045): `just deb` builds the binaries first, then runs
# cargo-deb with --no-build. Paths are relative to this crate; target/release
# is the workspace's. cargo-deb refuses other target directories, so `just deb`
# copies the static koje-forward (musl) to target/deb-staging/; it warns that
# it finds no library dependencies there – right for a static binary.
[package.metadata.deb]
name = "koje"
maintainer = "Michael P. Jung <michael.jung@terreon.de>"
extended-description = """\
koje isolates projects into contexts on Hyprland: each context is a rootless \
Podman container that runs all programs for that work, with its own color, \
layouts, states and memory limits. Run `koje setup` as your user after \
installing or upgrading."""
section = "utils"
priority = "optional"
depends = "$auto, podman, uidmap, passt, fuse-overlayfs, xdg-dbus-proxy, fontconfig, fuzzel, jq"
recommends = "hyprland, waybar, foot, mako-notifier, hypridle, hyprlock, grim, slurp, wl-clipboard, wireplumber, xdg-desktop-portal-hyprland, xdg-desktop-portal-gtk"
assets = [
    ["target/release/koje", "usr/bin/", "755"],
    ["target/release/kojed", "usr/bin/", "755"],
    ["target/release/koje-shell", "usr/bin/", "755"],
    ["../../target/deb-staging/koje-forward", "usr/lib/koje/", "755"],
    ["../../assets/bin/koje-window-picker", "usr/lib/koje/", "755"],
    ["../../assets/bin/koje-context-picker", "usr/lib/koje/", "755"],
    ["../../assets/bin/koje-app-menu", "usr/lib/koje/", "755"],
    ["../../assets/bin/koje-keys", "usr/lib/koje/", "755"],
    ["../../assets/systemd/kojed.service", "usr/lib/systemd/user/", "644"],
    ["../../assets/systemd/koje-shell.service", "usr/lib/systemd/user/", "644"],
    ["../../assets/systemd/koje-session.target", "usr/lib/systemd/user/", "644"],
    ["../../assets/systemd/koje-idle.service", "usr/lib/systemd/user/", "644"],
    ["../../assets/systemd/koje-polkit-agent.service", "usr/lib/systemd/user/", "644"],
    ["../../assets/systemd/waybar.service.d/koje.conf", "usr/lib/systemd/user/waybar.service.d/", "644"],
    ["../../assets/session/koje.desktop", "usr/share/wayland-sessions/", "644"],
    ["../../assets/hyprland/koje.conf", "usr/share/koje/hyprland/", "644"],
    ["../../assets/hyprland/hyprbars.conf", "usr/share/koje/hyprland/", "644"],
    ["../../assets/lock/hypridle.conf", "usr/share/koje/lock/", "644"],
    ["../../assets/lock/hyprlock.conf", "usr/share/koje/lock/", "644"],
    ["../../assets/fonts/lucide/lucide.ttf", "usr/share/fonts/truetype/koje/", "644"],
    ["../../assets/icons/io.koje.Koje-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["../../assets/fonts/lucide/LICENSE", "usr/share/doc/koje/lucide-LICENSE", "644"],
]
