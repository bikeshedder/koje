[package]
name = "koje"
description = "Command line client for koje: isolated work contexts on GNOME."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "koje"
path = "src/main.rs"

[dependencies]
koje-core.workspace = true
koje-podman.workspace = true
koje-runtime.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# The koje package (ADR 0045): `just deb` builds the binaries first, then runs
# cargo-deb with --no-build. Paths are relative to this crate; target/release
# is the workspace's. cargo-deb refuses other target directories, so `just deb`
# copies the static koje-forward (musl) to target/deb-staging/; it warns that
# it finds no library dependencies there – right for a static binary.
[package.metadata.deb]
name = "koje"
maintainer = "Michael P. Jung <michael.jung@terreon.de>"
extended-description = """\
koje isolates projects into contexts on GNOME: each context is a rootless \
Podman container that runs all programs for that work, with its own color, \
states and memory limits. Run `koje setup` as your user after \
installing or upgrading."""
section = "utils"
priority = "optional"
depends = "$auto, gnome-shell (>= 50), gnome-shell (<< 51~), gjs, gir1.2-adw-1, gir1.2-gtk-4.0, podman, uidmap, passt, fuse-overlayfs, xdg-dbus-proxy"
recommends = "foot"
assets = [
    ["target/release/koje", "usr/bin/", "755"],
    ["target/release/kojed", "usr/bin/", "755"],
    ["../../target/deb-staging/koje-forward", "usr/lib/koje/", "755"],
    ["../../assets/systemd/kojed.service", "usr/lib/systemd/user/", "644"],
    # koje's GNOME Shell extension (ADR 0059); `koje setup` enables it.
    ["../../gnome/build/extension/koje@koje.io/metadata.json", "usr/share/gnome-shell/extensions/koje@koje.io/", "644"],
    ["../../gnome/build/extension/koje@koje.io/extension.js", "usr/share/gnome-shell/extensions/koje@koje.io/", "644"],
    ["../../gnome/build/extension/koje@koje.io/dbus/*.xml", "usr/share/gnome-shell/extensions/koje@koje.io/dbus/", "644"],
    ["../../assets/icons/io.koje.Koje-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    # koje Settings (ADR 0060): gnome/ built by `just ui` (scripts/build-deb.sh).
    ["../../assets/bin/koje-settings", "usr/bin/", "755"],
    ["../../assets/applications/io.koje.Settings.desktop", "usr/share/applications/", "644"],
    ["../../gnome/build/api/*.js", "usr/share/koje/ui/api/", "644"],
    ["../../gnome/build/settings/*.js", "usr/share/koje/ui/settings/", "644"],
    ["../../gnome/build/settings/ui/*.ui", "usr/share/koje/ui/settings/ui/", "644"],
]
