# koje's part of the Hyprland configuration – installed by install.sh to
# $XDG_DATA_HOME/koje/hyprland/koje.conf and sourced from hyprland.conf.
# Overwritten on every install: put your own settings into hyprland.conf,
# below the `source` line – later settings win. A bind here is undone there with
# `unbind = MODS, key` (ADR 0037). Hyprland 0.53 syntax.
#
# koje ships a complete session (ADR 0037): look, basic bindings, workspaces,
# bar, notifications, idle and lock. Monitor, keyboard layout and GPU settings
# are the machine's and stay in hyprland.conf.

# --- session services ----------------------------------------------------------
# Portals and the session bus learn about the Wayland session:
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = mako
exec-once = hypridle
# The polkit agent lives in libexec or lib, depending on the distribution.
exec-once = sh -c 'for a in /usr/libexec/polkit-gnome-authentication-agent-1 /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1; do [ -x "$a" ] && exec "$a"; done'

# kojed: window colors per context, `koje focus` (systemd user unit kojed.service).
exec-once = systemctl --user start kojed

# --- look ----------------------------------------------------------------------
# Borders carry the context's color (ADR 0018) – a gradient to a lighter shade
# when focused (kojed sets them); soft shadows separate floating windows.
general {
    border_size = 3
    gaps_in = 4
    gaps_out = 8
}

decoration {
    rounding = 6
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000099)
        color_inactive = rgba(00000055)
    }
}

misc {
    disable_hyprland_logo = true
}

# Touchpads scroll "naturally" (content follows the fingers), as in GNOME;
# mouse wheels stay as they are. Focus changes on click, not by moving the
# pointer; scrolling still goes to the window under it.
input {
    follow_mouse = 2
    touchpad {
        natural_scroll = true
    }
}

# The pointer stays where it is when a window gets focus (Alt+Tab, the task
# list, the window picker).
cursor {
    no_warps = true
}

# Everything floats – koje places windows itself (concept "Desktop: Hyprland").
windowrule = match:class .*, float on

# Move / resize with the mouse: Super + left / middle button (right as touchpad fallback).
bindmd = SUPER, mouse:272, Move the window, movewindow
bindmd = SUPER, mouse:274, Resize the window, resizewindow
bindmd = SUPER, mouse:273, Resize the window, resizewindow

# Edge snapping for floating windows.
general {
    snap {
        enabled = true
    }
}

# No "Application not responding" dialog (ADR 0024): it fires for every window
# of a sleeping context; koje shows its own overlay instead.
misc {
    enable_anr_dialog = false
}

# Overlays for cross-context apps in the context `global` (mail, chat).
bindd = SUPER, M, Show or hide the mail overlay, togglespecialworkspace, mail
bindd = SUPER, C, Show or hide the chat overlay, togglespecialworkspace, chat
bindd = SUPER SHIFT, M, Move the window to the mail overlay, movetoworkspacesilent, special:mail
bindd = SUPER SHIFT, C, Move the window to the chat overlay, movetoworkspacesilent, special:chat

# Switching windows, until koje's own overview (M8): Alt+Tab cycles the
# workspace's windows (and raises the floating one), Super+Tab picks any window.
bindd = ALT, Tab, Next window on the workspace, cyclenext
bindd = ALT, Tab, Next window on the workspace, alterzorder, top
bindd = ALT SHIFT, Tab, Previous window on the workspace, cyclenext, prev
bindd = ALT SHIFT, Tab, Previous window on the workspace, alterzorder, top
bindd = SUPER, Tab, Pick any window, exec, ~/.local/lib/koje/koje-window-picker

# Stash: a hidden special workspace per context for running windows outside the
# active layout (M5.6). Super+H stashes the focused window, Super+Shift+H shows
# or hides the stash, Super+Ctrl+H brings the focused (stashed) window back.
bindd = SUPER, H, Stash the window, exec, ~/.local/bin/koje stash
bindd = SUPER SHIFT, H, Show or hide the stash, exec, ~/.local/bin/koje stash --show
bindd = SUPER CTRL, H, Bring the window back from the stash, exec, ~/.local/bin/koje unstash

# Layouts of the active context (M5.5): Super+] next, Super+[ previous.
bindd = SUPER, bracketright, Next layout of the context, exec, ~/.local/bin/koje layout next
bindd = SUPER, bracketleft, Previous layout of the context, exec, ~/.local/bin/koje layout prev

# --- basics --------------------------------------------------------------------
# Every binding has a description (bindd): Super+F1 lists them all, your own
# from hyprland.conf too – give those a description with `bindd` as well.
bindd = SUPER, F1, Show all keyboard shortcuts, exec, ~/.local/lib/koje/koje-keys
# Super+Return: a terminal in the active context, on the host outside one.
bindd = SUPER, Return, Terminal in the context, exec, ~/.local/bin/koje terminal
# Super+D: the programs of the active context (the running contexts outside one).
bindd = SUPER, D, Programs of the context, exec, ~/.local/lib/koje/koje-app-menu
bindd = SUPER, Q, Close the window, killactive
bindd = SUPER, F, Fullscreen, fullscreen
# Maximize keeps the bar and the gaps.
bindd = SUPER SHIFT, F, Maximize, fullscreen, 1
bindd = SUPER SHIFT, E, Leave Hyprland, exit
bindd = SUPER, Escape, Lock the screen, exec, hyprlock
# Next keyboard layout (kb_layout/kb_variant in hyprland.conf; also a click on the bar).
bindd = SUPER, space, Next keyboard layout, exec, hyprctl switchxkblayout all next
bindd = , Print, Screenshot of an area to the clipboard, exec, grim -g "$(slurp)" - | wl-copy

# Volume, brightness and media keys (Fn+F1… on laptops, ADR 0041): `koje media`
# changes the level and shows it; brightness through logind, no group `video`.
# They repeat when held (e) and work on the lock screen (l).
bindeld = , XF86AudioRaiseVolume, Volume up, exec, ~/.local/bin/koje media volume-up
bindeld = , XF86AudioLowerVolume, Volume down, exec, ~/.local/bin/koje media volume-down
bindld = , XF86AudioMute, Mute the sound, exec, ~/.local/bin/koje media mute
bindld = , XF86AudioMicMute, Mute the microphone, exec, ~/.local/bin/koje media mic-mute
bindeld = , XF86MonBrightnessUp, Brightness up, exec, ~/.local/bin/koje media brightness-up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, ~/.local/bin/koje media brightness-down
# Media keys go to the player that last started playing, on the host or in
# any context.
bindld = , XF86AudioPlay, Play or pause, exec, ~/.local/bin/koje media play-pause
bindld = , XF86AudioPause, Play or pause, exec, ~/.local/bin/koje media play-pause
bindld = , XF86AudioNext, Next track, exec, ~/.local/bin/koje media next
bindld = , XF86AudioPrev, Previous track, exec, ~/.local/bin/koje media previous

# Numbered workspaces for host windows; contexts have named ones (ADR 0028).
bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER, 6, Workspace 6, workspace, 6
bindd = SUPER, 7, Workspace 7, workspace, 7
bindd = SUPER, 8, Workspace 8, workspace, 8
bindd = SUPER, 9, Workspace 9, workspace, 9
bindd = SUPER SHIFT, 1, Move the window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move the window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move the window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move the window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move the window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move the window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move the window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move the window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move the window to workspace 9, movetoworkspace, 9
