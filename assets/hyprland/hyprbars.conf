# koje's title bars (hyprbars plugin, ADR 0039) – installed by koje setup to
# $XDG_DATA_HOME/koje/hyprland/hyprbars.conf, sourced from hyprland.conf by
# scripts/setup-hyprbars.sh once the plugin is installed. Without the plugin
# these options are unknown to Hyprland: do not source it before.
# Overwritten on every install. Hyprland 0.53 syntax.

# Load the plugins hyprpm manages.
exec-once = hyprpm reload -n

plugin {
    hyprbars {
        bar_height = 24
        bar_color = rgb(1e1e24)
        col.text = rgb(c8c8c8)
        bar_text_font = Noto Sans
        bar_text_size = 10
        # The context's border goes around the bar too.
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 10
        bar_button_padding = 6
        on_double_click = hyprctl dispatch fullscreen 1
        # Buttons, right to left: background, size, icon, command.
        hyprbars-button = rgb(e06c75), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(e5c07b), 12, , hyprctl dispatch fullscreen 1
    }
}

# Apps that draw their own header bar (GTK: GNOME apps, the file chooser,
# keyring prompts) get none. Add your own in hyprland.conf the same way.
windowrule = match:class ^(org\.gnome\..*|gcr-prompter|xdg-desktop-portal-gtk)$, hyprbars:no_bar on
