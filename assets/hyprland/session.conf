# koje's session (ADR 0048): `koje session start` runs Hyprland with this file.
# Installed by the koje package – do not edit; your settings (screens,
# keyboard, own bindings) go into ~/.config/koje/hyprland.conf, read last.

# koje's session: look, bindings, workspaces (ADR 0037).
source = /usr/share/koje/hyprland/koje.conf

# Hand the environment to systemd and start koje's services.
exec-once = koje session ready

# Yours, last: later settings win.
source = ~/.config/koje/hyprland.conf
