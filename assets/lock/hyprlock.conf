# koje's lock screen (ADR 0042), started by hypridle's lock_cmd: time, date
# and the password field over the blurred screen. GNOME's look follows with
# M8.38.
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

label {
    monitor =
    text = $TIME
    font_size = 96
    color = rgba(ffffffff)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    font_size = 20
    color = rgba(ffffffff)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(ffffff26)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffff40)
    fail_color = rgba(e01b24ff)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
