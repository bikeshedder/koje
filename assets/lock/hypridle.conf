# Idle, blank and lock in the koje session (ADR 0048): koje-idle.service runs
# hypridle with this file, so no ~/.config/hypr/hypridle.conf is needed.
# GNOME's defaults: the screen blanks and locks after 5 minutes, and locks
# before suspend. The times follow GNOME Settings with M8.44.
general {
    lock_cmd = pidof hyprlock || hyprlock --config /usr/share/koje/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# A moment later, so the lock screen is up before the screens go dark.
listener {
    timeout = 310
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
