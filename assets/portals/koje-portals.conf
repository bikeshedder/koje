# Portal backends in the koje session (ADR 0048). xdg-desktop-portal picks this
# file by the first entry of XDG_CURRENT_DESKTOP (koje:GNOME); without it, it
# falls back to gnome-portals.conf, whose screen sharing and screenshots need
# Mutter.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
