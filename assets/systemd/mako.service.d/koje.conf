# mako's package activates it for org.freedesktop.Notifications; in the koje
# session koje-shell is the notification server (M8.36), so mako is skipped
# there – it could take the name before the shell. Other sessions keep it.
# Installed by the koje package to /usr/lib/systemd/user/.
[Service]
ExecCondition=/bin/sh -c 'test "$XDG_SESSION_DESKTOP" != koje'
