# In the koje session xdph reads koje's config – its screen sharing picker
# (ADR 0050) – from the runtime directory: `koje session start` writes this
# file and removes it when the session ends. Other sessions keep the user's
# ~/.config/hypr/xdph.conf. Installed by the koje package to
# /usr/lib/systemd/user/.
[Service]
EnvironmentFile=-%t/koje/xdph.env
