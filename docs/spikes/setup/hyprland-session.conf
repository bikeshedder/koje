# Starter config for a real Hyprland session (M2.1, M2.9) – Hyprland 0.53 syntax.
# Use it from ~/.config/hypr/hyprland.conf:
#
#   source = ~/projects/koje/docs/spikes/setup/hyprland-session.conf
#   # your own additions below
#
# Packages (Ubuntu): hyprland hyprland-guiutils|hyprland-qtutils hyprlock hypridle waybar
#   mako-notifier fuzzel foot grim slurp wl-clipboard fonts-font-awesome (waybar icons)
#   xdg-desktop-portal-hyprland xdg-desktop-portal-gtk policykit-1-gnome
# Not every package may exist under that name; note what was missing in the M2.1 report.

# Highest refresh rate instead of the monitor's "preferred" mode. For an exact mode:
#   monitor = DP-1, 3840x2160@144, 0x0, 1      (names/modes: hyprctl monitors all)
monitor = , highrr, auto, 1

# --- NVIDIA (Hyprland wiki) -----------------------------------------------------
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
cursor {
    no_hardware_cursors = true
}
# With an iGPU *and* an NVIDIA card driving the monitor, Hyprland may render on the
# iGPU and copy every frame (laggy). Put the NVIDIA card first – the device from
# /dev/dri/by-path for the NVIDIA PCI address (here 01:00.0). Needs a Hyprland restart.
# env = AQ_DRM_DEVICES,/dev/dri/card1

$mod = SUPER
$terminal = foot
$launcher = fuzzel

input {
    kb_layout = us
    kb_variant = colemak
    follow_mouse = 1
}

general {
    border_size = 4
    gaps_in = 4
    gaps_out = 8
    # Edge snapping for floating windows.
    snap {
        enabled = true
    }
}

decoration {
    rounding = 6
}

misc {
    disable_hyprland_logo = true
}

# --- koje: everything floats -------------------------------------------------
windowrule = match:class .*, float on

# Move / resize with the mouse (concept: LMB / MMB; RMB as a touchpad fallback).
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:274, resizewindow
bindm = $mod, mouse:273, resizewindow

# --- basics --------------------------------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, E, exit
bind = $mod, Escape, exec, hyprlock
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Workspaces 1–9 (koje later: one workspace per context)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# --- koje: overlays and stash (concept) ---------------------------------------
bind = $mod, M, togglespecialworkspace, mail
bind = $mod, C, togglespecialworkspace, chat
bind = $mod SHIFT, M, movetoworkspacesilent, special:mail
bind = $mod SHIFT, C, movetoworkspacesilent, special:chat
bind = $mod, H, movetoworkspacesilent, special:stash
bind = $mod SHIFT, H, togglespecialworkspace, stash
bind = $mod CTRL, H, movetoworkspace, +0

# --- session services ----------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
# Portals and the session bus learn about the Wayland session:
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- M2.9: screen capture permissions (off by default; see the M2.9 report) ---
# ecosystem {
#     enforce_permissions = true
# }
# permission = /usr/bin/grim, screencopy, deny
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
