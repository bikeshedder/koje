# M2.5: storage.conf for a context that reads images from a shared, read-only
# store. Copy to ~/.config/containers/storage.conf inside the context (a user
# storage.conf replaces the system one, so it repeats the driver settings).
[storage]
driver = "overlay"

[storage.options]
additionalimagestores = ["SHARED_STORE"]

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
