# Hyprland config for the M2 spikes, nested in GNOME:
#   XDG_CURRENT_DESKTOP=Hyprland Hyprland -c "$PWD/docs/spikes/setup/hyprland-nested.conf"
# GNOME keeps the Super key, so ALT is the modifier here. Syntax changes between
# Hyprland releases: if a line is rejected, note the fix in the spike report.

monitor = , preferred, auto, 1

$mod = ALT
$terminal = foot   # any Wayland terminal installed on the host

input {
    # Nested Hyprland does not inherit GNOME's layout; set yours
    # (GNOME: gsettings get org.gnome.desktop.input-sources sources).
    kb_layout = us
    kb_variant = colemak
}

general {
    border_size = 4
    gaps_in = 4
    gaps_out = 8
    # Edge snapping for floating windows (M2.1).
    snap {
        enabled = true
    }
}

# Everything floats – koje places windows itself. Newer syntax: match first,
# every rule with a value (older releases: `windowrule = float, class:.*`).
windowrule = match:class .*, float on

# Move / resize with the mouse (concept: LMB / MMB).
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:274, resizewindow

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit          # leaves only this nested Hyprland

# Overlays (M2.1, M2.8): special workspaces toggled by key.
bind = $mod, M, togglespecialworkspace, mail
bind = $mod, C, togglespecialworkspace, chat
bind = $mod SHIFT, M, movetoworkspacesilent, special:mail
bind = $mod SHIFT, C, movetoworkspacesilent, special:chat
# The stash (M2.8): a hidden special workspace.
bind = $mod, H, movetoworkspacesilent, special:stash
bind = $mod SHIFT, H, togglespecialworkspace, stash
# Unstash: with the stash shown, move the focused window to the current workspace.
bind = $mod CTRL, H, movetoworkspace, +0

misc {
    disable_hyprland_logo = true
}
